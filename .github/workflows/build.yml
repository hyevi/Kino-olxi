name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip source
        run: |
          mkdir -p source
          unzip -q .github/source.zip -d source
          # если в архиве верхнеуровневая папка source/ — выравниваем
          if [ -d "source/source" ]; then
            shopt -s dotglob
            mv source/source/* source/
            rm -rf source/source
          fi

      - name: Guard — placeholder вместо токена
        run: |
          if [ -f source/token.env ] && grep -q "KINOPOISK_API_TOKEN=." source/token.env; then
            if ! grep -q "ВСТАВЬТЕ" source/token.env; then
              echo "❌ В source.zip лежит реальный токен. Замените на placeholder."
              exit 1
            fi
          fi
          echo "✅ Проверка пройдена"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        working-directory: ./source
        run: npm install

      - name: Add Android platform (если нет)
        working-directory: ./source
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        working-directory: ./source
        run: npx cap sync android

      - name: Grant gradlew
        working-directory: ./source/android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: ./source/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kino-olxi-debug-apk
          path: source/android/app/build/outputs/apk/debug/app-debug.apk
